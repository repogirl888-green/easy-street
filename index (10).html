<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Street</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F6B45">
<meta name="apple-mobile-web-app-title" content="Easy Street">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sign:#1F6B45; --sign-deep:#164F33; --signtext:#FFFFFF;
  --curb:#F2C230; --asphalt:#2E3136; --bg:#EEF1EC; --card:#FFFFFF;
  --ink:#1D2023; --muted:#5B6168; --line:#D5DAD2; --up:#1F6B45; --down:#B23A2E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E21; --card:#25292D; --ink:#EDEFEA; --muted:#A3AAA4; --line:#3A3F44;
    --asphalt:#141618; --up:#4FBF83; --down:#F07A6C;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E21; --card:#25292D; --ink:#EDEFEA; --muted:#A3AAA4; --line:#3A3F44;
  --asphalt:#141618; --up:#4FBF83; --down:#F07A6C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--curb);outline-offset:2px}

/* The street sign: the one bold thing */
.sign{background:var(--sign);color:var(--signtext);border-radius:10px;
  padding:6px;box-shadow:0 3px 0 var(--sign-deep)}
.sign-inner{border:3px solid var(--signtext);border-radius:6px;padding:10px 16px 8px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sign h1{margin:0;font-weight:900;font-size:40px;line-height:1;letter-spacing:-.5px}
.sign h1 small{font-size:24px;font-weight:800}
.pts{text-align:right;font-weight:600;font-size:14px;line-height:1.2}
.pts b{display:block;font-size:26px;font-weight:900}
.post{width:14px;height:22px;margin:0 auto;background:linear-gradient(90deg,#7C8288,#A9AFB4,#7C8288)}
.tag{margin:14px 2px 20px;color:var(--muted);font-size:15px}

h2{font-size:22px;font-weight:800;margin:26px 0 10px;line-height:1.2}
.event{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:14px;overflow:hidden}
.event-head{display:flex;gap:14px;align-items:center;padding:16px;width:100%;
  background:none;border:0;color:inherit;text-align:left}
.icon{flex:0 0 46px;height:46px;border-radius:50%;background:var(--curb);color:#1D2023;
  display:grid;place-items:center;font-size:22px}
.event-head h3{margin:0;font-size:18px;font-weight:800;line-height:1.25}
.event-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.status{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.status.done{color:var(--up)}
.body{padding:0 16px 18px;display:none}
.event.open .body{display:block}
.explain{border-left:4px solid var(--curb);padding:2px 0 2px 12px;margin:0 0 14px}
.explain h4{margin:10px 0 2px;font-size:15px;font-weight:800}
.explain p{margin:0;font-size:16px}
.q{font-weight:800;font-size:18px;margin:16px 0 10px;line-height:1.3}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:transparent;color:var(--ink);
  border-radius:10px;padding:12px 8px;font-weight:800;font-size:16px}
.choice[aria-pressed="true"]{border-color:var(--sign);background:var(--sign);color:#fff}
.stakes{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
.stakes span{font-size:14px;color:var(--muted);margin-right:4px}
.stake{border:2px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.stake[aria-pressed="true"]{border-color:var(--curb);background:var(--curb);color:#1D2023}
.go{width:100%;border:0;border-radius:10px;padding:14px;background:var(--asphalt);
  color:#fff;font-weight:800;font-size:17px;margin-top:4px}
.go:disabled{opacity:.4;cursor:not-allowed}
.result{border-radius:10px;padding:14px;margin-top:6px;background:var(--bg)}
.result .big{font-weight:900;font-size:20px}
.result.win .big{color:var(--up)} .result.lose .big{color:var(--down)}
.result p{margin:6px 0 0;font-size:16px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* glossary */
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.term summary{padding:14px 16px;font-weight:800;font-size:17px;list-style:none;cursor:pointer;
  display:flex;justify-content:space-between}
.term summary::after{content:"+";font-weight:900;color:var(--sign)}
.term[open] summary::after{content:"–"}
.term summary::-webkit-details-marker{display:none}
.term p{margin:0;padding:0 16px 16px;font-size:16px}

/* picks */
.pick{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.pick b.w{color:var(--up)} .pick b.l{color:var(--down)}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px}
.reset{margin-top:18px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:0}
.disc{font-size:13px;color:var(--muted);margin-top:30px}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--asphalt);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:0;color:#B9BEC2;padding:12px 4px 14px;font-weight:700;font-size:14px;
  border-top:4px solid transparent}
nav button[aria-current="page"]{color:#fff;border-top-color:var(--curb)}
nav .ni{display:block;font-size:20px;line-height:1.2}
.view{display:none}.view.active{display:block}
@media (prefers-reduced-motion:no-preference){
  .result{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="sign" role="banner">
    <div class="sign-inner">
      <h1>Easy <small>St</small></h1>
      <div class="pts">Your points<b id="pts">1,000</b></div>
    </div>
  </div>
  <div class="post" aria-hidden="true"></div>
  <p class="tag">Learn what moves the market. Make a call with points, not money.</p>

  <section class="view active" id="v-today" aria-label="This week">
    <h2>This week on the street</h2>
    <div id="events"></div>
  </section>

  <section class="view" id="v-learn" aria-label="Learn">
    <h2>Market words, plain English</h2>
    <div id="terms"></div>
  </section>

  <section class="view" id="v-picks" aria-label="My picks">
    <h2>My picks</h2>
    <div id="picks"></div>
    <button class="reset" id="reset">Start over with 1,000 points</button>
  </section>

  <p class="disc">Easy Street is for learning only. Points have no cash value, and nothing here is financial advice. Practice rounds use simulated outcomes.</p>
</div>

<nav aria-label="Main">
  <div class="row">
    <button data-v="today" aria-current="page"><span class="ni" aria-hidden="true">🚦</span>This week</button>
    <button data-v="learn"><span class="ni" aria-hidden="true">📖</span>Learn</button>
    <button data-v="picks"><span class="ni" aria-hidden="true">🎯</span>My picks</button>
  </div>
</nav>

<script>
const EVENTS = [
  { id:"fed", icon:"🏛️", title:"Fed interest rate decision", when:"Wednesday, 2 p.m.",
    what:"The Federal Reserve decides whether to raise, lower, or hold the interest rate banks charge each other overnight.",
    why:"That rate ripples out to car loans, mortgages, and credit cards. Lower rates usually make borrowing cheaper and can give stocks a lift.",
    watch:"The press conference after the decision. Traders listen for hints about the next move.",
    q:"Will the Fed hold rates where they are?", a:["Hold","Change"], p:0.6,
    lesson:["The Fed held steady. When prices are still rising faster than it wants, the Fed often waits to see more data before moving.",
            "The Fed changed rates. Big moves like this usually follow a string of reports showing the economy speeding up or slowing down."] },
  { id:"jobs", icon:"👷🏾‍♀️", title:"Monthly jobs report", when:"Friday, 8:30 a.m.",
    what:"The Labor Department counts how many jobs the economy added or lost last month, plus the unemployment rate.",
    why:"More jobs means more paychecks and more spending. But very strong numbers can make the Fed worry about inflation.",
    watch:"The headline number compared with what economists expected. Surprises move the market more than the number itself.",
    q:"Will the report beat economists' forecast?", a:["Beat","Miss"], p:0.5,
    lesson:["Jobs beat the forecast. Stocks can still dip on good news if investors think it keeps rates higher for longer.",
            "Jobs missed the forecast. A weak report can hurt, but some investors cheer it because it raises the odds of a rate cut."] },
  { id:"spx", icon:"📈", title:"S&P 500 for the week", when:"Closes Friday, 4 p.m.",
    what:"The S&P 500 tracks 500 of the biggest U.S. companies. People use it as a quick read on the whole stock market.",
    why:"Most retirement accounts and index funds follow it, so its direction touches millions of people's savings.",
    watch:"Big news days, like the Fed and jobs report above. They often set the tone for the week.",
    q:"Will the S&P 500 finish the week higher?", a:["Higher","Lower"], p:0.55,
    lesson:["The S&P 500 closed higher. Historically it has gone up in a bit more than half of all weeks, which is why long-term investors stay patient.",
            "The S&P 500 closed lower. Down weeks are normal. Even in strong years, the index drops in plenty of weeks along the way."] },
  { id:"cpi", icon:"🛒", title:"Inflation report (CPI)", when:"Tuesday, 8:30 a.m.",
    what:"The Consumer Price Index measures how much the price of everyday things, like groceries, rent, and gas, changed.",
    why:"High inflation shrinks what a dollar buys and pushes the Fed to keep rates high.",
    watch:"'Core' inflation, which leaves out food and gas because those prices jump around a lot.",
    q:"Will inflation come in cooler than expected?", a:["Cooler","Hotter"], p:0.5,
    lesson:["Inflation came in cooler. That's usually good news for stocks, since it makes a rate cut more likely.",
            "Inflation came in hotter. Markets often slip on this, because it points to rates staying high."] }
];
const TERMS = [
  ["Stock","A tiny slice of ownership in a company. If the company grows, your slice can be worth more."],
  ["Index","A scoreboard that tracks a group of stocks, so you can see how that group is doing at a glance."],
  ["S&P 500","An index of 500 large U.S. companies. It's the most common way to say how 'the market' did."],
  ["Dow Jones","An older index of just 30 big, well-known U.S. companies. It's famous, but narrower than the S&P 500."],
  ["Nasdaq","Both a stock exchange and an index. The Nasdaq Composite leans heavily toward tech companies."],
  ["NYSE","The New York Stock Exchange, the marketplace on Wall Street where many big company stocks are bought and sold."],
  ["The Fed","The Federal Reserve, the U.S. central bank. It sets key interest rates and tries to keep prices stable and jobs plentiful."],
  ["Inflation","When prices rise over time, so the same dollar buys less than before."],
  ["Bull and bear","A bull market is a long stretch of rising prices. A bear market is a drop of 20% or more from a recent high."],
  ["Index fund","A fund that simply buys everything in an index, so you own a little of every company in it."]
];

const START = 1000;
let state = { pts:START, picks:{} };
try { const s = localStorage.getItem("easystreet"); if (s) state = JSON.parse(s); } catch(e){}
function save(){ try{ localStorage.setItem("easystreet", JSON.stringify(state)); }catch(e){} }
const fmt = n => n.toLocaleString("en-US");
const draft = {};

function renderPts(){ document.getElementById("pts").textContent = fmt(state.pts); }

function renderEvents(){
  const box = document.getElementById("events"); box.innerHTML = "";
  EVENTS.forEach(ev => {
    const pick = state.picks[ev.id], d = draft[ev.id] || {};
    const el = document.createElement("article");
    el.className = "event" + (d.open ? " open" : "");
    let body;
    if (pick){
      body = `<div class="result ${pick.win?"win":"lose"}" role="status">
        <div class="big">${pick.win?"+":"−"}${fmt(pick.stake)} points</div>
        <p>You picked <b>${pick.choice}</b>. ${ev.lesson[pick.outcome]}</p></div>`;
    } else {
      body = `<p class="q">${ev.q}</p>
        <div class="choices">${ev.a.map((a,i)=>`<button class="choice" data-c="${i}" aria-pressed="${d.choice===i}">${a}</button>`).join("")}</div>
        <div class="stakes"><span>Put in</span>${[50,100,200].map(s=>`<button class="stake" data-s="${s}" aria-pressed="${d.stake===s}" ${s>state.pts?"disabled":""}>${s}</button>`).join("")}</div>
        <button class="go" ${d.choice==null||!d.stake?"disabled":""}>Lock in my pick</button>
        <p class="note">Practice round: the outcome is simulated so you can see how it plays out.</p>`;
    }
    el.innerHTML = `<button class="event-head" aria-expanded="${!!d.open}">
        <span class="icon" aria-hidden="true">${ev.icon}</span>
        <span><h3>${ev.title}</h3><p>${ev.when}</p></span>
        <span class="status ${pick?"done":""}">${pick?(pick.win?"Won":"Lost"):"Open"}</span></button>
      <div class="body">
        <div class="explain">
          <h4>What is it?</h4><p>${ev.what}</p>
          <h4>Why it matters</h4><p>${ev.why}</p>
          <h4>What to watch</h4><p>${ev.watch}</p>
        </div>${body}</div>`;
    el.querySelector(".event-head").onclick = () => { draft[ev.id] = {...d, open:!d.open}; renderEvents(); };
    el.querySelectorAll(".choice").forEach(b => b.onclick = () => { draft[ev.id] = {...d, choice:+b.dataset.c}; renderEvents(); });
    el.querySelectorAll(".stake").forEach(b => b.onclick = () => { draft[ev.id] = {...d, stake:+b.dataset.s}; renderEvents(); });
    const go = el.querySelector(".go");
    if (go) go.onclick = () => {
      const outcome = Math.random() < ev.p ? 0 : 1;
      const win = outcome === d.choice;
      state.pts += win ? d.stake : -d.stake;
      state.picks[ev.id] = { choice:ev.a[d.choice], stake:d.stake, outcome, win, title:ev.title };
      save(); renderPts(); renderEvents(); renderPicks();
    };
    box.appendChild(el);
  });
}

function renderTerms(){
  document.getElementById("terms").innerHTML = TERMS.map(([t,d]) =>
    `<details class="term"><summary>${t}</summary><p>${d}</p></details>`).join("");
}

function renderPicks(){
  const list = Object.values(state.picks), box = document.getElementById("picks");
  if (!list.length){ box.innerHTML = `<div class="empty">No picks yet. Open an event on This week, read the explainer, and make your first call.</div>`; return; }
  const wins = list.filter(p=>p.win).length;
  box.innerHTML = `<p>${wins} of ${list.length} calls right. Balance: <b>${fmt(state.pts)}</b> points.</p>` +
    list.map(p => `<div class="pick"><span>${p.title}<br><small style="color:var(--muted)">Picked ${p.choice}</small></span>
      <b class="${p.win?"w":"l"}">${p.win?"+":"−"}${fmt(p.stake)}</b></div>`).join("");
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.removeAttribute("aria-current"));
  b.setAttribute("aria-current","page");
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("v-"+b.dataset.v).classList.add("active");
  window.scrollTo(0,0);
});
document.getElementById("reset").onclick = () => {
  state = { pts:START, picks:{} }; for (const k in draft) delete draft[k];
  save(); renderPts(); renderEvents(); renderPicks();
};

renderPts(); renderEvents(); renderTerms(); renderPicks();
</script>
</body>
</html>
